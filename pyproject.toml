[project]
name = "estimador-cag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jose Lacruz", email = "lacruzjd@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi[standard]>=0.162.0",
    "openai>=3.37.0",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
estimador-cag = "estimador_cag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."
